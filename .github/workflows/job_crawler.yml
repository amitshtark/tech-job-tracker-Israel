name: Daily Israeli Tech Job Crawler

on:
  schedule:
    # Runs 4 times a day (UTC 06:00, 10:00, 14:00, 18:00 -> Israel 08:00, 12:00, 16:00, 20:00)
    - cron: '0 6,10,14,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-flash-lite-latest"
        run: |
          python job_crawler.py

      - name: Commit and Push Updated Seen Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update seen jobs database [skip ci]" && git push)

      - name: Upload Daily Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-jobs-excel
          path: new_jobs_*.xlsx
          retention-days: 14
